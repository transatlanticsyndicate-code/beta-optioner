# Nginx config для crypto.optioner.online
# Подпроект: Vite + TypeScript SPA, бэкенд — облачный Supabase
# Раздача статики из /var/www/crypto, без backend proxy
# На сервере этот файл лежит как /etc/nginx/sites-enabled/crypto.optioner.online.conf

# HTTP → HTTPS redirect
server {
    if ($host = crypto.optioner.online) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name crypto.optioner.online;
    return 404;
}

# HTTPS
server {
    listen 443 ssl;
    server_name crypto.optioner.online;
    underscores_in_headers on;

    ssl_certificate /etc/letsencrypt/live/crypto.optioner.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crypto.optioner.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/crypto;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование запросов к CoinMarketCap API
    # ЗАЧЕМ: обход CORS для прямых запросов к pro-api.coinmarketcap.com из браузера
    location /cmc-api/ {
        rewrite ^/cmc-api/(.*) /$1 break;
        proxy_pass https://pro-api.coinmarketcap.com;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host pro-api.coinmarketcap.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование запросов к Supabase через наш сервер
    # ЗАЧЕМ: домен *.supabase.co заблокирован DNS в ряде регионов (Панама и др.) —
    # фронтенд ходит на /sb/..., а nginx прозрачно пересылает всё в Supabase
    # Покрывает REST (/rest/v1/), Auth (/auth/v1/), Realtime WebSocket (/realtime/v1/), Storage
    location /sb/ {
        rewrite ^/sb/(.*) /$1 break;
        proxy_pass https://heqxverlxphawhnuntph.supabase.co;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_set_header Host heqxverlxphawhnuntph.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket поддержка для Supabase Realtime
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Таймауты увеличены — Realtime держит соединение длительно
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Отключаем буферизацию для стриминга
        proxy_buffering off;
    }
}

# Map для корректной обработки WebSocket upgrade header
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
